<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظم المهام والعادات اليومية</title>
    
    <!-- كود إثبات ملكية جوجل سيرش كونسول -->
    <meta name="google-site-verification" content="u5ip7G65If23kGIVGOoLgaYjQpE2x3TFBtsXp8GtamY" />

    <script src="https://pl30811863.effectivecpmnetwork.com/35/04/58/350458ab2183b752d7c9ea594c01d076.js"></script>
    
    <style>
        /* الألوان والتنسيقات الهادئة العامة */
        :root {
            --bg-color: #f7f9fb;
            --card-bg: #ffffff;
            --accent-soft: #84a9ac;
            --accent-hover: #3b6978;
            --text-main: #2b2e4a;
            --text-muted: #6c757d;
            --border-color: #e4e9ed;
            --alert-bg: #fff3cd;
            --alert-text: #856404;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* كروت الأقسام */
        .card {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border-color);
        }

        h2 {
            margin-top: 0;
            color: var(--accent-hover);
            font-size: 1.3rem;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 10px;
        }

        /* 1. قائمة المهام */
        .todo-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        button {
            background-color: var(--accent-soft);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease;
            font-size: 0.95rem;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .todo-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .todo-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .todo-item label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .todo-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent-soft);
            cursor: pointer;
        }

        .todo-item.completed span {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        /* التنبيه للمهام المتبقية */
        .alert-box {
            background-color: var(--alert-bg);
            color: var(--alert-text);
            padding: 12px 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 0.9rem;
            display: none;
        }

        /* 2. تحدي اليوم */
        .challenge-section {
            text-align: center;
        }

        .challenge-card {
            margin-top: 15px;
            padding: 20px;
            background-color: var(--bg-color);
            border-radius: 12px;
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--accent-hover);
            display: none;
            animation: fadeIn 0.4s ease;
        }

        /* 3. تتبع العادات الشهري */
        .habits-table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 10px 5px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.85rem;
        }

        th:first-child, td:first-child {
            text-align: right;
            padding-right: 10px;
            min-width: 150px;
        }

        /* الدوائر المرقّمة */
        .day-circle {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 1px solid var(--accent-soft);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin: 0 auto;
            font-size: 0.75rem;
            color: var(--accent-hover);
            transition: all 0.2s;
            user-select: none;
        }

        .day-circle.active {
            background-color: var(--accent-soft);
            color: white;
            border-color: var(--accent-soft);
        }

        /* 4. تنسيقات مؤقت البومودورو */
        .pomodoro-section {
            text-align: center;
        }

        .timer-display {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--accent-hover);
            margin: 15px 0;
            font-family: monospace;
        }

        .pomodoro-btn-group {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        /* 5. منظم العبادات والورد اليومي */
        .wird-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .wird-group {
            background-color: var(--bg-color);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .wird-group h3 {
            margin-top: 0;
            font-size: 1rem;
            color: var(--accent-hover);
            margin-bottom: 10px;
        }

        .wird-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .wird-item input[type="checkbox"] {
            accent-color: var(--accent-soft);
            width: 16px;
            height: 16px;
        }

        .progress-container {
            margin-top: 20px;
            background-color: var(--bg-color);
            border-radius: 10px;
            height: 20px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--accent-soft);
            transition: width 0.3s ease;
        }

        .progress-text {
            text-align: center;
            font-size: 0.85rem;
            margin-top: 8px;
            color: var(--text-muted);
            font-weight: bold;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- القسم الأول: قائمة المهام اليومية -->
        <div class="card">
            <h2>📝 قائمة المهام اليومية</h2>
            <div class="todo-input-group">
                <input type="text" id="taskInput" placeholder="اكتب مهمتك هنا...">
                <button onclick="addTask()">إضافة مهمة</button>
            </div>

            <ul class="todo-list" id="todoList"></ul>

            <!-- صندوق التنبيه للمهام المتبقية -->
            <div class="alert-box" id="reminderAlert"></div>
        </div>

        <!-- القسم الثاني: تحدي اليوم -->
        <div class="card challenge-section">
            <h2>🎯 تحدي اليوم</h2>
            <button onclick="getDailyChallenge()">اكتشف تحدي اليوم</button>
            <div class="challenge-card" id="challengeDisplay"></div>
        </div>

        <!-- القسم الثالث: تتبع العادات الشهري -->
        <div class="card">
            <h2>📅 تتبع العادات الشهري</h2>
            <div class="todo-input-group">
                <input type="text" id="habitInput" placeholder="أضف عادة جديدة لتتبعها...">
                <button onclick="addHabit()">إضافة عادة</button>
            </div>

            <div class="habits-table-container">
                <table id="habitsTable">
                    <thead>
                        <tr id="tableHeader">
                            <th>العادة</th>
                            <!-- الأيام من 1 إلى 30 هتنزل هنا بالـ JavaScript -->
                        </tr>
                    </thead>
                    <tbody id="habitsBody"></tbody>
                </table>
            </div>
        </div>

        <!-- القسم الرابع: مؤقت البومودورو -->
        <div class="card pomodoro-section">
            <h2>🍅 مؤقت البومودورو</h2>
            <div class="timer-display" id="timerDisplay">25:00</div>
            <div class="pomodoro-btn-group">
                <button onclick="startTimer()">بدء</button>
                <button onclick="pauseTimer()">إيقاف</button>
                <button onclick="resetTimer()">إعادة</button>
            </div>
        </div>

        <!-- القسم الخامس: منظم العبادات والورد اليومي -->
        <div class="card">
            <h2>🌿 منظم العبادات والورد اليومي</h2>
            <div class="wird-grid">
                
                <!-- مجموعة الصلوات -->
                <div class="wird-group">
                    <h3>🕌 الصلوات الخمس</h3>
                    <label class="wird-item"><input type="checkbox" class="wird-check" onchange="updateWirdProgress()"> صلاة الفجر</label>
                    <label class="wird-item"><input type="checkbox" class="wird-check" onchange="updateWirdProgress()"> صلاة الظهر</label>
                    <label class="wird-item"><input type="checkbox" class="wird-check" onchange="updateWirdProgress()"> صلاة العصر</label>
                    <label class="wird-item"><input type="checkbox" class="wird-check" onchange="updateWirdProgress()"> صلاة المغرب</label>
                    <label class="wird-item"><input type="checkbox" class="wird-check" onchange="updateWirdProgress()"> صلاة العشاء</label>
                </div>

                <!-- مجموعة الأذكار -->
                <div class="wird-group">
                    <h3>📖 الأذكار والسنن</h3>
                    <label class="wird-item"><input type="checkbox" class="wird-check" onchange="updateWirdProgress()"> أذكار الصباح</label>
                    <label class="wird-item"><input type="checkbox" class="wird-check" onchange="updateWirdProgress()"> أذكار المساء</label>
                    <label class="wird-item"><input type="checkbox" class="wird-check" onchange="updateWirdProgress()"> صلاة الضحى</label>
                    <label class="wird-item"><input type="checkbox" class="wird-check" onchange="updateWirdProgress()"> قيام الليل</label>
                </div>

                <!-- مجموعة الورد القُرآني -->
                <div class="wird-group">
                    <h3>✨ الورد والتلاوة</h3>
                    <label class="wird-item"><input type="checkbox" class="wird-check" onchange="updateWirdProgress()"> قراءة الورد اليومي</label>
                    <label class="wird-item"><input type="checkbox" class="wird-check" onchange="updateWirdProgress()"> قراءة سورة الملك</label>
                </div>

            </div>

            <!-- شريط التقدم والإنجاز -->
            <div class="progress-container">
                <div class="progress-bar" id="wirdProgressBar"></div>
            </div>
            <div class="progress-text" id="wirdProgressText">إنجازك اليومي: 0%</div>
        </div>

    </div>

    <script>
        /* --- 1. برمجة قائمة المهام --- */
        let tasks = [];

        function addTask() {
            const input = document.getElementById('taskInput');
            const text = input.value.trim();

            if (text !== '') {
                tasks.push({ text: text, completed: false });
                input.value = '';
                renderTasks();
            }
        }

        function toggleTask(index) {
            tasks[index].completed = !tasks[index].completed;
            renderTasks();
        }

        function renderTasks() {
            const list = document.getElementById('todoList');
            list.innerHTML = '';

            tasks.forEach((task, index) => {
                const li = document.createElement('li');
                li.className = `todo-item ${task.completed ? 'completed' : ''}`;
                li.innerHTML = `
                    <label>
                        <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${index})">
                        <span>${task.text}</span>
                    </label>
                `;
                list.appendChild(li);
            });

            checkRemainingTasks();
        }

        function checkRemainingTasks() {
            const alertBox = document.getElementById('reminderAlert');
            const remaining = tasks.filter(t => !t.completed).length;

            if (tasks.length > 0) {
                alertBox.style.display = 'block';
                if (remaining === 0) {
                    alertBox.style.backgroundColor = '#d4edda';
                    alertBox.style.color = '#155724';
                    alertBox.innerText = '✨ رائع جداً! لقد أنهيت جميع مهامك اليوم.';
                } else {
                    alertBox.style.backgroundColor = 'var(--alert-bg)';
                    alertBox.style.color = 'var(--alert-text)';
                    alertBox.innerText = `💡 تذكير: باقي لديك (${remaining}) مهام لم تكتمل بعد!`;
                }
            } else {
                alertBox.style.display = 'none';
            }
        }

        /* --- 2. برمجة تحدي اليوم (30 تحدي متنوع) --- */
        const challenges = [
            "صلاة الضحى (ركعتين صلاة الأوابين)",
            "قراءة سورة الملك قبل النوم",
            "الاستغفار 100 مرة بيقين",
            "الصلاة على النبي 100 مرة",
            "قراءة صفحة واحدة بتمعن من القرآن الكريم",
            "قراءة أذكار الصباح أو المساء في وقتها",
            "صلاة ركعتين قيام ليل قبل النوم",
            "الحوقلة (لا حول ولا قوة إلا بالله) 100 مرة",
            "إرسال رسالة طيبة تشجع بيها حد من أصحابك أو أهلك",
            "تقديم مساعدة بسيطة لحد في البيت من غير ما يطلب",
            "التصدق بأي مبلغ بسيط أو إطعام طير/حيوان",
            "ابتسامة وكلمة طيبة لأي حد تقابله النهاردة",
            "إظهار الامتنان والشكر لشخص أثر في حياتك",
            "المذاكرة أو العمل بتركيز لمدة 45 دقيقة بدون فتح الموبايل",
            "كتابة 3 إنجازات بسيطة عملتها النهاردة مهما كانت صغيرة",
            "تعلم 5 كلمات إنجليزية جديدة بالمعنى والنطق",
            "قراءة 5 صفحات من كتاب مفيد أو مقال ملهم",
            "ترتيب وتنظيف مكان مكتبك أو غرفتك بالكامل",
            "كتابة 20 نعمة في حياتك وممتن ليها واحمد ربنا عليها",
            "التخلص من عادة التأجيل في مهمة واحدة مؤجلة بقالها فترة",
            "شرب 2 لتر ماء على مدار اليوم",
            "المشي أو الحركة لمدة 15 دقيقة والتنفس بهدوء",
            "الابتعاد عن السوشيال ميديا وقفل الموبايل ساعة كاملة قبل النوم",
            "أخذ استراحة لمدة 10 دقائق للتنفس والاسترخاء وتفريغ العقبات",
            "النوم المبكر للاستيقاظ بنشاط",
            "التقليل من السكريات أو وجبة غير صحية النهاردة",
            "عمل تمارين إطالة (Stretching) خفيفة للجسم بعد المذاكرة",
            "غسل الوجه بماء بارد وتدليك العينين للراحة",
            "الخروج في مكان مفتوح ورؤية السماء أو الطبيعة لدقائق",
            "عمل حاجة بتحبها وبتفرحك النهاردة تكافئ بيها نفسك!"
        ];

        function getDailyChallenge() {
            const randomIndex = Math.floor(Math.random() * challenges.length);
            const display = document.getElementById('challengeDisplay');
            display.innerText = challenges[randomIndex];
            display.style.display = 'block';
        }

        /* --- 3. برمجة جدول تتبع العادات الشهري --- */
        const tableHeader = document.getElementById('tableHeader');
        for (let i = 1; i <= 30; i++) {
            const th = document.createElement('th');
            th.innerText = i;
            tableHeader.appendChild(th);
        }

        function addHabit() {
            const input = document.getElementById('habitInput');
            const habitText = input.value.trim();

            if (habitText !== '') {
                const tbody = document.getElementById('habitsBody');
                const tr = document.createElement('tr');

                const tdName = document.createElement('td');
                tdName.innerText = habitText;
                tr.appendChild(tdName);

                for (let i = 1; i <= 30; i++) {
                    const tdDay = document.createElement('td');
                    const circle = document.createElement('div');
                    circle.className = 'day-circle';
                    circle.innerText = i;
                    
                    circle.onclick = function() {
                        this.classList.toggle('active');
                    };

                    tdDay.appendChild(circle);
                    tr.appendChild(tdDay);
                }

                tbody.appendChild(tr);
                input.value = '';
            }
        }

        /* --- 4. برمجة مؤقت البومودورو --- */
        let timeLeft = 25 * 60;
        let timerId = null;

        function updateDisplay() {
            let m = Math.floor(timeLeft / 60);
            let s = timeLeft % 60;
            document.getElementById('timerDisplay').innerText = 
                `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        }

        function startTimer() {
            if(timerId) return;
            timerId = setInterval(() => {
                timeLeft--;
                updateDisplay();
                if(timeLeft <= 0) {
                    clearInterval(timerId);
                    timerId = null;
                    alert('🎉 انتهى وقت التركيز! خد استراحة.');
                }
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timerId);
            timerId = null;
        }

        function resetTimer() {
            pauseTimer();
            timeLeft = 25 * 60;
            updateDisplay();
        }

        /* --- 5. برمجة منظم العبادات وشريط الإنجاز --- */
        function updateWirdProgress() {
            const checkboxes = document.querySelectorAll('.wird-check');
            const total = checkboxes.length;
            let checkedCount = 0;

            checkboxes.forEach(cb => {
                if(cb.checked) checkedCount++;
            });

            const percentage = Math.round((checkedCount / total) * 100);
            
            const progressBar = document.getElementById('wirdProgressBar');
            const progressText = document.getElementById('wirdProgressText');

            progressBar.style.width = percentage + '%';
            progressText.innerText = `إنجازك الروحي اليومي: ${percentage}% 🌿`;
        }
    </script>
</body>
    </html>
